<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Connecting…</title>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #444; background: #faf9f6; }
  </style>
</head>
<body>
  <div id="msg">Connecting…</div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var error = params.get('error');
      var payload = { source: 'social-manager-oauth', code: code, error: error };
      try {
        if (window.opener) {
          window.opener.postMessage(payload, window.location.origin);
          document.getElementById('msg').textContent = error
            ? 'That did not work — you can close this window.'
            : 'Connected — you can close this window.';
          setTimeout(function () { window.close(); }, 600);
        } else {
          document.getElementById('msg').textContent = 'Missing opener window — close this tab and try again.';
        }
      } catch (e) {
        document.getElementById('msg').textContent = 'Something went wrong — close this tab and try again.';
      }
    })();
  </script>
</body>
</html>
